[package]
name = "ebook-manager"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
libc = "0.2"
async-channel = "2"
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
webkit6 = "0.6"
tempfile = "3"
sha2 = "0.10"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ebook-device = { path = "../../crates/ebook-device" }
ebook-library = { path = "../../crates/ebook-library" }
ebook-reader = { path = "../../crates/ebook-reader" }

[dev-dependencies]
libtest-mimic = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

# The web view tests keep GTK on one thread, so they bring their own runner.
[[test]]
name = "view"
harness = false
