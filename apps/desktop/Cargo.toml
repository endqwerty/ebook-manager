[package]
name = "ebook-manager"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
libc = "0.2"
async-channel = "2"
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
tempfile = "3"
sha2 = "0.10"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ebook-device = { path = "../../crates/ebook-device" }
ebook-library = { path = "../../crates/ebook-library" }
ebook-reader = { path = "../../crates/ebook-reader" }

[dev-dependencies]
# The generated catalogue, for driving the read thread over many pages.
ebook-library = { path = "../../crates/ebook-library", features = ["fixture"] }
