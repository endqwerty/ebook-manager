[package]
name = "ebook-reader"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sandboxed EPUB parsing and reading engine for Ebook Manager"
publish = false

[lib]
name = "ebook_reader"

[[bin]]
name = "ebook-reader-helper"
path = "src/bin/helper.rs"

[dependencies]
quick-xml = "0.37"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
