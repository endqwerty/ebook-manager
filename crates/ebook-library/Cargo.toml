[package]
name = "ebook-library"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
icu_collator = "2.4.0"
icu_locale = "2.4.0"
unicode-normalization = "0.1.26"
caseless = "0.2.2"
