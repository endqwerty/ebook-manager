# Runs the checks and reports them to Mainworthy (https://mainworthy.com, project ebook-manager), whose gate decides
# whether the commit passes. The repository names the instance with the variables MAINWORTHY_URL and
# MAINWORTHY_PROJECT and the secret MAINWORTHY_TOKEN (a pipeline token; see AGENTS.md, "Tests and CI").
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put mainworthy on the path
        run: |
          image=ghcr.io/endqwerty/mainworthy:main
          docker pull --quiet "$image"
          container=$(docker create "$image")
          mkdir -p "$RUNNER_TEMP/bin"
          docker cp "$container:/usr/local/bin/mainworthy" "$RUNNER_TEMP/bin/mainworthy"
          docker rm "$container" >/dev/null
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/mainworthy" version

      - name: Install desktop and reader dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev bubblewrap xvfb openbox dbus-x11 dosfstools \
            python3-gi gir1.2-atspi-2.0 at-spi2-core xdotool xauth imagemagick tesseract-ocr-eng

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: nextest@0.9.152

      - name: Install the release application and helper
        run: make install PREFIX="$RUNNER_TEMP/ebook-manager"

      - name: Run the workspace tests
        run: apps/desktop/tests/private-session.sh cargo nextest run --release --workspace --locked --profile ci --no-fail-fast

      - name: Import, read, restart and export from the desktop
        id: desktop
        run: |
          /usr/bin/python3 apps/desktop/tests/smoke.py "$RUNNER_TEMP/ebook-manager/bin/ebook-manager" "$RUNNER_TEMP/desktop-evidence"
          /usr/bin/python3 apps/desktop/tests/smoke.py "$RUNNER_TEMP/ebook-manager/bin/ebook-manager" "$RUNNER_TEMP/desktop-evidence/shelf-only" --shelf

      - name: Exercise mounted FAT32 card export
        id: card
        run: |
          image="$RUNNER_TEMP/card.img"
          card="$RUNNER_TEMP/card"
          truncate -s 128M "$image"
          mkfs.fat -F 32 "$image"
          mkdir "$card"
          sudo mount -t vfat -o "loop,uid=$(id -u),gid=$(id -g)" "$image" "$card"
          trap 'sudo umount "$card"' EXIT
          TMPDIR="$card" cargo nextest run --release --locked -p ebook-device --test export \
            -E 'test(=retries_keep_one_copy_and_collisions_preserve_the_original)'

      - name: Measure catalogue browsing at both library sizes
        id: scale
        run: cargo run --release --locked -p ebook-library --features fixture --bin scale

      - name: Start, search and import with 100,000 books in the desktop
        id: desktop_scale
        run: |
          cargo build --release --locked -p ebook-library --features fixture --bin fixture
          /usr/bin/python3 apps/desktop/tests/scale.py "$RUNNER_TEMP/ebook-manager/bin/ebook-manager" target/release/fixture

      - name: Report results and read the gate
        if: always()
        env:
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          SCALE_OUTCOME: ${{ steps.scale.outcome }}
          DESKTOP_SCALE_OUTCOME: ${{ steps.desktop_scale.outcome }}
          CARD_OUTCOME: ${{ steps.card.outcome }}
          MAINWORTHY_URL: ${{ vars.MAINWORTHY_URL }}
          MAINWORTHY_PROJECT: ${{ vars.MAINWORTHY_PROJECT }}
          MAINWORTHY_TOKEN: ${{ secrets.MAINWORTHY_TOKEN }}
        run: |
          python3 - "$RUNNER_TEMP/desktop-checks.xml" <<'PYTHON'
          import os
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.Element("testsuite", name="Linux integration")
          for name, outcome in [
              ("Import, read, restart and export", os.environ["DESKTOP_OUTCOME"]),
              ("Scale benchmark", os.environ["SCALE_OUTCOME"]),
              ("Desktop at 100,000 books", os.environ["DESKTOP_SCALE_OUTCOME"]),
              ("Mounted FAT32 export", os.environ["CARD_OUTCOME"]),
          ]:
              case = ET.SubElement(suite, "testcase", name=name)
              if outcome != "success":
                  ET.SubElement(case, "failure", message=f"GitHub Actions step: {outcome}")
          ET.ElementTree(suite).write(sys.argv[1], encoding="utf-8", xml_declaration=True)
          PYTHON
          mainworthy report target/nextest/ci/junit.xml "$RUNNER_TEMP/desktop-checks.xml"
          mainworthy gate

  # The shared core on macOS, where the reader's helper runs under sandbox-exec. Not reported to Mainworthy yet.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the core's tests
        run: cargo test --release --locked --no-fail-fast -p ebook-reader -p ebook-library -p ebook-device --features ebook-library/fixture

      - name: Export to a mounted FAT32 volume
        run: |
          hdiutil create -size 64m -fs "MS-DOS FAT32" -volname EBOOKTEST "$RUNNER_TEMP/card.dmg"
          card="$RUNNER_TEMP/card"
          mkdir "$card"
          hdiutil attach -mountpoint "$card" "$RUNNER_TEMP/card.dmg"
          trap 'hdiutil detach "$card"' EXIT
          diskutil info "$card" | grep "FAT32"
          TMPDIR="$card" cargo test --release --locked -p ebook-device
